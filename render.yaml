services:
  - type: web
    name: ong-frutos-do-amanha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ong_demo
      - key: JWT_SECRET
        generateValue: true
      - key: ONG_ADMIN_EMAIL
        sync: false
      - key: ONG_ADMIN_PASSWORD
        sync: false
      - key: ONG_ADMIN_NOME
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # As tres abaixo sao o endereco publico do servico. O Render so decide
      # esse endereco ao criar o servico, e ele nao e necessariamente o nome
      # acima: se o nome ja estiver em uso, ele acrescenta um sufixo. Por isso
      # ficam como sync: false, para voce colar a URL de verdade no primeiro
      # deploy. Com um valor errado aqui, o retorno do Mercado Pago cai em
      # outro dominio e o CORS barra o proprio site.
      - key: APP_FRONTEND_BASE_URL
        sync: false
      - key: APP_BACKEND_PUBLIC_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
