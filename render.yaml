services:
  - type: web
    name: ong-frutos-do-amanha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ong_demo
      - key: JWT_SECRET
        generateValue: true
      - key: ONG_ADMIN_EMAIL
        sync: false
      - key: ONG_ADMIN_PASSWORD
        sync: false
      - key: ONG_ADMIN_NOME
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: APP_FRONTEND_BASE_URL
        value: https://ong-frutos-do-amanha.onrender.com
      - key: APP_BACKEND_PUBLIC_URL
        value: https://ong-frutos-do-amanha.onrender.com
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://ong-frutos-do-amanha.onrender.com
