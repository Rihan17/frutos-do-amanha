spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:ong}
spring.data.mongodb.auto-index-creation=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=https://ong-api
app.jwt.expiration-minutes=30
app.admin-seed.email=${ONG_ADMIN_EMAIL:}
app.admin-seed.password=${ONG_ADMIN_PASSWORD:}
app.admin-seed.nome=${ONG_ADMIN_NOME:Administrador Inicial}
app.admin-seed.telefone=${ONG_ADMIN_TELEFONE:}

# Recuperação de senha por e-mail: habilite após configurar as credenciais SMTP.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5500}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:60}

# Mercado Pago: o token e o segredo do webhook permanecem somente no backend.
app.mercado-pago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercado-pago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.mercado-pago.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5500}
app.mercado-pago.backend-public-url=${APP_BACKEND_PUBLIC_URL:}
